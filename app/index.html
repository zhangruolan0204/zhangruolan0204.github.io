<meta name="mobile-web-app-capable" content="yes">

<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="stylesheet" href="styles.css?v=42">
<script>
/* 版本升级时强制清场：注销全部 Service Worker + 清空全部缓存 + 重载一次
   —— 彻底解决浏览器一直执行旧脚本导致菜单点不动的问题（只执行一次，不会循环） */
(function () {
  try {
    var V = 'v42';
    if (localStorage.getItem('qz_ver') !== V) {
      try { localStorage.setItem('qz_ver', V); } catch (e) { }
      if (window.caches && caches.keys) {
        caches.keys().then(function (ks) {
          return Promise.all(ks.map(function (k) { return caches.delete(k); }));
        }).catch(function () { });
      }
      if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
        navigator.serviceWorker.getRegistrations().then(function (rs) {
          rs.forEach(function (r) { r.unregister(); });
        }).catch(function () { });
      }
      if (location.search.indexOf('nc=') < 0) {
        var qs = location.search ? location.search + '&' : '?';
        location.replace(location.pathname + qs + 'nc=' + Date.now() + (location.hash || ''));
      }
    }
  } catch (e) { }
})();
</script>
</head>
<body>

<!-- 底部细提示条：显示实际加载的版本 + 清缓存入口，出错时整条变红；可点 × 隐藏 -->
<div id="verbar" class="verbar">
  <span id="verbarTxt">秋招工作台 v42</span>
  <button class="verbar-btn" onclick="return (window.QZ && QZ.hardReset) ? QZ.hardReset() : location.reload();">清缓存</button>
  <button class="verbar-x" title="隐藏这条提示（下次更新版本会重新出现）" onclick="return (window.QZ && QZ.hideVerbar) ? QZ.hideVerbar() : (document.getElementById('verbar').style.display='none');">&times;</button>
</div>

<!-- ========== 登录页 ========== -->
<div id="login" class="login-screen">
  <div class="login-bg"></div>
  <div class="login-card">
    <div class="login-head" id="loginIcon"></div>
    <h1 class="login-title">2027 秋招管理工作台</h1>
    <p class="login-sub">电子信息类主攻 · 软件测试等转行方向兼容 · 全站密码保护</p>
    <form id="loginForm" autocomplete="off" onsubmit="return (window.QZ && QZ.loginSubmit) ? QZ.loginSubmit(event) : false;">
      <label class="field">
        <span class="field-label">登录账号</span>
        <input id="loginUser" type="text" placeholder="请输入账号" value="admin" autocomplete="username">
      </label>
      <label class="field">
        <span class="field-label">登录密码</span>
        <input id="loginPass" type="password" placeholder="请输入密码" value="admin2027" autocomplete="current-password">
      </label>
      <button class="btn btn-primary btn-block" type="submit">进入工作台</button>
      <p class="login-err" id="loginErr"></p>
    </form>
    <div class="login-tips">
      <div class="tip-row"><b>超级管理员</b><span>admin / admin2027（可管理全站数据、账号与同步权限）</span></div>
      <div class="tip-row"><b>普通账号</b><span>guest / 2027qiuzhao（仅查看个人秋招数据）</span></div>
    </div>
    <p class="login-foot">数据保存在本机浏览器，未登录无法访问任何页面内容</p>
  </div>
</div>

<!-- ========== 工作台主体 ========== -->
<div id="app" class="app hidden">
  <aside id="sidebar" class="sidebar">
    <div class="brand">
      <div class="brand-icon" id="brandIcon"></div>
      <div class="brand-text">
        <strong>秋招工作台</strong>
        <span>2027 Campus Recruit</span>
      </div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">
      <div class="side-user" id="sideUser"></div>
      <button class="btn btn-ghost btn-sm btn-block" id="logoutBtn">退出登录</button>
    </div>
  </aside>
  <div class="scrim" id="scrim"></div>

  <main class="main">
    <header class="topbar">
      <button class="icon-btn only-mobile" id="menuBtn" aria-label="展开菜单">☰</button>
      <div class="topbar-title">
        <h1 id="pageTitle">首页总览</h1>
        <p id="pageDesc">秋招全局数据看板</p>
      </div>
      <div class="topbar-actions">
        <span class="chip" id="roleChip"></span>
        <button class="btn btn-soft btn-sm" id="syncBtn">飞书同步</button>
        <button class="btn btn-soft btn-sm" id="exportBtn">导出备份</button>
      </div>
    </header>
    <div class="content" id="content"></div>
    <footer class="foot">
      <span>WorkBuddy 秋招工作台 · 数据存于本机浏览器，建议定期导出备份</span>
      <span id="footSync" class="foot-sync"></span>
    </footer>
  </main>
</div>

<div id="modalRoot"></div>
<div id="toast" class="toast"></div>
<button id="installBtn" class="install-btn hidden">添加到手机主屏幕</button>

<!-- 常驻诊断胶囊：显示实际加载版本与错误原文，便于快速定位 -->
<div id="diag" class="diag-pill"></div>
<script>
function qzShowErr(msg) {
  if (window.QZ && QZ.paintDiag) { try { QZ.paintDiag(msg, true); } catch (e) { } }
  var vb = document.getElementById('verbarTxt'), bar = document.getElementById('verbar');
  if (vb) vb.textContent = 'v42 · ' + msg;
  if (bar) bar.style.background = '#ff4d4f';
  var d = document.getElementById('diag');
  if (d) { d.className = 'diag-pill bad'; d.style.display = 'block'; d.textContent = msg; }
}
window.addEventListener('error', function (ev) {
  qzShowErr('脚本错误：' + (ev.message || '未知') + ' @' +
    String(ev.filename || '').split('/').pop() + ':' + ev.lineno);
});
window.addEventListener('unhandledrejection', function (ev) {
  qzShowErr('异步错误：' + ((ev.reason && ev.reason.message) || ev.reason || '未知'));
});
</script>
<script src="resume-parser.js?v=42" defer></script>
<script src="resume-store.js?v=42" defer></script>
<script src="pdf-text.js?v=42" defer></script>
<script src="fit-analyzer.js?v=42" defer></script>
<script src="data.js?v=42" defer></script>
<script src="core.js?v=42" defer></script>
<script src="pages.js?v=42" defer></script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js?v=42').catch(function () {});
      // 新版本 Service Worker 接管后自动刷新一次，保证总是展示最新版本
      var refreshing = false;
      navigator.serviceWorker.addEventListener('controllerchange', function () {
        if (refreshing) return;
        refreshing = true;
        window.location.reload();
      });
    });
  }
</script>
